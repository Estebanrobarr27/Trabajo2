# ============================================================
# Juventudes — Despliegue automático en GitHub Pages
# Cada push a "main" compila la app y publica la carpeta dist.
# Sitio final: https://TU-USUARIO.github.io/NOMBRE-DEL-REPOSITORIO/
# (funciona con cualquier nombre de repositorio, no hay que configurar nada)
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el despliegue manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos: cancela el anterior si hay uno en curso
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        # npm ci es más rápido y reproducible; si el repositorio no tiene
        # package-lock.json, se usa npm install como respaldo.
        run: npm ci || npm install

      - name: Compilar la aplicación
        run: npm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir la carpeta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
